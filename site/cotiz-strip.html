<!-- Cotizaciones v1 -->
<div class="cz1" id="cz1" aria-label="Cotización del dólar en la región"><div class="cz1-in"><span class="cz1-k">1 US$ =</span><div class="cz1-tr" id="cz1tr"><span class="cz1-ld">Cargando cotizaciones…</span></div></div></div>
<style>
.cz1{background:#0A1730;color:#fff;font:600 14px Barlow,Arial,sans-serif;border-bottom:1px solid #1E3A66;overflow:hidden}
.cz1-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:0 16px;height:38px}
.cz1-k{flex:none;color:#76C46E;font-weight:700;letter-spacing:1px;font-size:13px}
.cz1-tr{flex:1;overflow:hidden;position:relative;mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.cz1-rail{display:inline-flex;gap:26px;white-space:nowrap;animation:cz1m 45s linear infinite}
.cz1:hover .cz1-rail{animation-play-state:paused}
.cz1-it{display:inline-flex;align-items:center;gap:6px}.cz1-it svg{border-radius:2px;flex:none}
.cz1-it b{font-weight:700}.cz1-it small{color:#9FB3C8;font-weight:600}
.cz1-up{color:#8FD786}.cz1-dn{color:#FF8A80}.cz1-eq{color:#9FB3C8}
.cz1-sep{color:#3A5A88}
.cz1-ld{color:#9FB3C8}
@keyframes cz1m{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.cz1-rail{animation:none}.cz1-tr{overflow-x:auto}}
@media print{.cz1{display:none}}
</style>
<script>
(function(){
var F={py:'<rect width="30" height="20" fill="#fff"/><rect width="30" height="6.67" fill="#D52B1E"/><rect y="13.33" width="30" height="6.67" fill="#0038A8"/>',
ar:'<rect width="30" height="20" fill="#74ACDF"/><rect y="6.67" width="30" height="6.67" fill="#fff"/><circle cx="15" cy="10" r="2.2" fill="#F6B40E"/>',
br:'<rect width="30" height="20" fill="#009C3B"/><path d="M15 2.5L27 10 15 17.5 3 10z" fill="#FFDF00"/><circle cx="15" cy="10" r="3.6" fill="#002776"/>',
cl:'<rect width="30" height="20" fill="#fff"/><rect y="10" width="30" height="10" fill="#D52B1E"/><rect width="10" height="10" fill="#0039A6"/><circle cx="5" cy="5" r="1.6" fill="#fff"/>',
uy:'<rect width="30" height="20" fill="#fff"/><g fill="#0038A8"><rect y="2.2" width="30" height="2.2"/><rect y="6.7" width="30" height="2.2"/><rect y="11.1" width="30" height="2.2"/><rect y="15.6" width="30" height="2.2"/></g><rect width="12" height="11.1" fill="#fff"/><circle cx="6" cy="5.5" r="3" fill="#FCD116"/>',
bo:'<rect width="30" height="6.67" fill="#D52B1E"/><rect y="6.67" width="30" height="6.67" fill="#F9E300"/><rect y="13.33" width="30" height="6.67" fill="#007934"/>',
pe:'<rect width="30" height="20" fill="#fff"/><rect width="10" height="20" fill="#D91023"/><rect x="20" width="10" height="20" fill="#D91023"/>',
eu:'<rect width="30" height="20" fill="#003399"/><circle cx="15" cy="10" r="5" fill="none" stroke="#FFCC00" stroke-width="1.2" stroke-dasharray="1 1.6"/>',
oil:'<rect width="30" height="20" rx="3" fill="#1E3A66"/><path d="M15 3c-3 4.5-5 7-5 9.5a5 5 0 0010 0C20 10 18 7.5 15 3z" fill="#F5B82E"/>'};
function fl(c){return '<svg viewBox="0 0 30 20" width="21" height="14" aria-hidden="true">'+F[c]+'</svg>'}
function nf(v,d){return v.toLocaleString('es-PY',{minimumFractionDigits:d,maximumFractionDigits:d})}
function vr(a,b){if(!b)return '';var p=(a-b)/b*100;if(Math.abs(p)<.05)return ' <span class="cz1-eq">=</span>';return ' <span class="'+(p>0?'cz1-up':'cz1-dn')+'">'+(p>0?'▲':'▼')+nf(Math.abs(p),1)+'%</span>'}
var L=[['py','PYG','Gs',0],['ar','ARS','$ AR',0],['br','BRL','R$',2],['cl','CLP','$ CL',0],['uy','UYU','$ UY',2],['bo','BOB','Bs',2],['pe','PEN','S/',2],['eu','EUR','€',2]];
fetch('/cotiz.php').then(function(r){return r.json()}).then(function(j){
 var u=j.usd||{},pv=(j.prev&&j.prev.usd)||{},it=[];
 L.forEach(function(x){var v=u[x[1]];if(!v)return;var t='<span class="cz1-it">'+fl(x[0])+'<small>'+x[2]+'</small> <b>'+nf(v,x[3])+'</b>'+vr(v,pv[x[1]]);
  if(x[1]==='ARS'&&j.ar&&j.ar.blue)t+=' <small>· blue</small> <b>'+nf(j.ar.blue.venta,0)+'</b>';
  it.push(t+'</span>')});
 var o=j.oil||{},po=(j.prev&&j.prev.oil)||{};
 if(o.brent)it.push('<span class="cz1-it">'+fl('oil')+'<small>Brent</small> <b>US$ '+nf(o.brent.usd,2)+'</b>'+vr(o.brent.usd,po.brent&&po.brent.usd)+'</span>');
 if(o.wti)it.push('<span class="cz1-it">'+fl('oil')+'<small>WTI</small> <b>US$ '+nf(o.wti.usd,2)+'</b>'+vr(o.wti.usd,po.wti&&po.wti.usd)+'</span>');
 if(!it.length)throw 0;
 var h=it.join('<span class="cz1-sep">|</span>');
 document.getElementById('cz1tr').innerHTML='<div class="cz1-rail">'+h+'<span class="cz1-sep">|</span>'+h+'<span class="cz1-sep">|</span></div>';
}).catch(function(){var e=document.getElementById('cz1');if(e)e.style.display='none'});
})();
</script>
